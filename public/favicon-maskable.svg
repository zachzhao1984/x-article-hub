<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="X Article Hub">
  <!--
    Maskable variant, source for public/icon-512-maskable.png.

    Same mark, full-bleed tile and the artwork pulled into the middle 80% safe zone.
    An installed icon may be cropped to any shape within that zone — a circle on
    Android, a squircle on iOS — so the paper background has to reach every edge or
    the mask exposes transparency as a dark halo.

    Regenerate with:
      rsvg-convert -w 512 -h 512 public/favicon-maskable.svg -o public/icon-512-maskable.png
  -->
  <defs>
    <linearGradient id="gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FBE9B4"/>
      <stop offset="0.45" stop-color="#E8BC5E"/>
      <stop offset="1" stop-color="#B07F22"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="#F4F1EA"/>

  <g>
    <path d="M12,13 L52,13 L32,32 Z" fill="#2A323C"/>
    <path d="M12,13 L32,32 L12,51 Z" fill="#1B212A"/>
    <path d="M52,13 L32,32 L52,51 Z" fill="#232A34"/>
    <path d="M12,51 L32,32 L52,51 Z" fill="#141920"/>
  </g>

  <path d="M12,13 L52,13 L52,51 L12,51 Z" fill="none" stroke="#0B0E13" stroke-width="1.1"/>

  <path d="M32,27.0
           C32,25.1 33.9,32 37.0,32
           C33.9,32 32,38.9 32,36.9
           C32,38.9 30.1,32 27.0,32
           C30.1,32 32,25.1 32,27.0 Z"
        fill="url(#gold)"/>
</svg>
