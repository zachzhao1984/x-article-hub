<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="X Article Hub">
  <!--
    Identity: the X brand blue tile carries the association; the glyph is the X
    mark sitting over a single text rule, which reads as "an article" rather than
    "a logo". The tile has its own background so it stays legible against both
    light and dark browser chrome, where favicons actually live.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b9cf5"/>
      <stop offset="1" stop-color="#0d7ac2"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>

  <!-- X mark -->
  <g transform="translate(18 12.5) scale(1.1667)" fill="#ffffff">
    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
  </g>

  <!-- the article's text rule -->
  <rect x="17" y="45.5" width="30" height="6" rx="3" fill="#ffffff" opacity="0.92"/>
</svg>
