<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Safari pinned-tab mask. Safari reads the alpha channel as a stencil and paints
    whatever survives with the user's own toolbar colour, so this file is a flat
    silhouette: no background, no gradient, no fill colour of its own. Omitting the
    paper tile here is what keeps a pinned tab from rendering as a solid square.

    The seal is knocked OUT of the envelope rather than painted on it, which is why
    it is drawn through a mask — filling it white would make it opaque and the
    stencil would come out a featureless rectangle.
  -->
  <defs>
    <mask id="stencil">
      <rect width="64" height="64" fill="#000"/>
      <path d="M8,9 L56,9 L56,55 L8,55 Z" fill="#fff"/>
      <!-- the four flap seams, cut out -->
      <path d="M8,9 L32,32 L56,9" stroke="#000" stroke-width="1.6" fill="none"/>
      <path d="M8,55 L32,32 L56,55" stroke="#000" stroke-width="1.6" fill="none"/>
      <!-- the seal, cut out -->
      <path d="M32,25.4
               C32,23.4 33.9,32 38.6,32
               C33.9,32 32,40.6 32,38.6
               C32,40.6 30.1,32 25.4,32
               C30.1,32 32,23.4 32,25.4 Z" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" fill="#000" mask="url(#stencil)"/>
</svg>
