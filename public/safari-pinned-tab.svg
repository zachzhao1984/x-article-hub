<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Safari pinned-tab mask. Safari reads the alpha channel as a stencil and paints
    whatever survives with the user's own toolbar colour, so this file is a flat
    silhouette: no background, no gradient, no fill colour of its own. Omitting the
    tile here is what keeps a pinned tab from rendering as a solid square.

    Traced from android-chrome-512x512.png rather than redrawn by hand, so it is
    provably the same mark as every other icon. The source has no vector form, so
    this is a 96x96 luminance threshold with vertically merged runs — coarse
    enough to be honest about being a stencil, fine enough that the envelope folds
    and the upper notch survive.

    The gold star is not represented: at 1-bit it would either vanish or turn into
    a hole, and Safari tints the whole shape one colour anyway, so a cut-out star
    would read as a defect rather than a seal.
  -->
