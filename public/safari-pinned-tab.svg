<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Safari pinned-tab mask. Safari reads the alpha channel as a stencil and paints
    whatever survives with the user's own toolbar colour, so this file is a flat
    silhouette: no background, no gradient, no fill colour of its own. Omitting
    the tile here is what keeps a pinned tab from rendering as a solid square.

    The X and the text rule are knocked OUT of the disc, which is why they are
    drawn through a mask — painting them white would make them opaque and the
    mask would come out a featureless circle.
  -->
  <defs>
    <mask id="stencil">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="32" cy="32" r="28" fill="#fff"/>
      <!-- the X mark, cut out -->
      <path d="M32 19 L45 45" stroke="#000" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M45 19 L19 45" stroke="#000" stroke-width="6.5" stroke-linecap="round"/>
      <!-- the article's text rule, cut out -->
      <rect x="23" y="51" width="18" height="4.5" rx="2.25" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" fill="#000" mask="url(#stencil)"/>
</svg>
